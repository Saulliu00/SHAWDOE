<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KindWords</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>KindWords</h1>
      <div id="status-indicator" class="status-dot"></div>
    </header>

    <section class="popup-section">
      <div class="toggle-row">
        <label for="main-toggle">Enable KindWords</label>
        <input type="checkbox" id="main-toggle" checked>
      </div>
    </section>

    <section class="popup-section">
      <h2>Platforms</h2>
      <div class="toggle-row">
        <label for="youtube-toggle">YouTube</label>
        <input type="checkbox" id="youtube-toggle" checked>
      </div>
      <div class="toggle-row">
        <label for="twitch-toggle">Twitch</label>
        <input type="checkbox" id="twitch-toggle" checked>
      </div>
    </section>

    <section class="popup-section">
      <h2>Warmth</h2>
      <select id="warmth-select">
        <option value="low">Low - close to original wording</option>
        <option value="medium" selected>Medium - balanced and natural</option>
        <option value="high">High - extra warm and kind</option>
      </select>
      <p class="setting-hint" id="warmth-hint">How warm the rewritten text should be</p>
    </section>

    <section class="popup-section stats-section">
      <div class="stat">
        <span class="stat-value" id="today-count">0</span>
        <span class="stat-label">Rewritten today</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="total-count">0</span>
        <span class="stat-label">Total rewritten</span>
      </div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
